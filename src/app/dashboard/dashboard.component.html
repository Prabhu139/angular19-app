<div class="mat-elevation-z8 table-container">
    <mat-toolbar>
      <mat-checkbox>0 Selected</mat-checkbox>
      <button mat-icon-button>
        <mat-icon>filter_alt</mat-icon>
      </button>
      <span class="spacer"></span>
      <button mat-icon-button>
        <mat-icon>table_chart</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>view_column</mat-icon>
      </button>
    </mat-toolbar>
  
    <table mat-table [dataSource]="dataSource" matSort class="mat-dark-theme">
  
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox></mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox></mat-checkbox>
        </td>
      </ng-container>
  
      <!-- Asset ID Column -->
      <ng-container matColumnDef="assetId">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Asset ID</th>
        <td mat-cell *matCellDef="let row">{{ row.assetId }}</td>
      </ng-container>
  
      <!-- Asset Name Column -->
      <ng-container matColumnDef="assetName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Asset Name</th>
        <td mat-cell *matCellDef="let row">{{ row.assetName }}</td>
      </ng-container>
  
      <!-- Status Column -->
      <ng-container matColumnDef="status" class="header">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Status</th>
        <td mat-cell *matCellDef="let row" class="header">
          <!-- <span class="badge" [ngClass]="row.status.toLowerCase()">{{ row.status }}</span> -->
          <!-- <span class="badge" [ngClass]="row.status.toLowerCase().replace(/\s+/g, '-')">{{ row.status }}</span> -->
          <span class="badge" [ngClass]="getStatusClass(row.status)">{{ row.status }}</span>


        </td>
      </ng-container>
  
      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">IT Type</th>
        <td mat-cell *matCellDef="let row">{{ row.type }}</td>
      </ng-container>
  
      <!-- Department Column -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Department</th>
        <td mat-cell *matCellDef="let row">{{ row.department }}</td>
      </ng-container>
  
      <!-- Created Column -->
      <ng-container matColumnDef="created" >
        <th mat-header-cell *matHeaderCellDef mat-sort-header  class="header">Created</th>
        <td mat-cell *matCellDef="let row">{{ row.created }}</td>
      </ng-container>
  
      <!-- Header & Row Declarations -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
    </table>
  
    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
