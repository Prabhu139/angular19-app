<div class="mat-elevation-z8 table-container">
  <mat-toolbar>
    <mat-checkbox
      [checked]="isAllSelected()"
      [indeterminate]="selection.hasValue() && !isAllSelected()"
      (change)="toggleAllRows()"
    >
      {{ selection.selected.length }} Selected
    </mat-checkbox>
    <button mat-icon-button class="left">
      <mat-icon>filter_alt</mat-icon>
    </button>

    <span class="spacer"></span>
    <button mat-icon-button #columnBtn (click)="openColumnMenu(columnBtn)" matTooltip="Click to Open Column Settings">
      <mat-icon class="hoever">sort</mat-icon>
    </button>
  </mat-toolbar>

  <table mat-table [dataSource]="dataSource" matSort class="mat-dark-theme">

    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          [checked]="isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
          (change)="toggleAllRows()"
        ></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="toggleRow(row)"
          [checked]="selection.isSelected(row)"
        ></mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="assetId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Asset ID</th>
      <td mat-cell *matCellDef="let row">{{ row.assetId }}</td>
    </ng-container>

    <ng-container matColumnDef="assetName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Asset Name</th>
      <td mat-cell *matCellDef="let row">{{ row.assetName }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Status</th>
      <td mat-cell *matCellDef="let row">
        <span class="badge" [ngClass]="getStatusClass(row.status)">{{ row.status }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">IT Type</th>
      <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Department</th>
      <td mat-cell *matCellDef="let row">{{ row.department }}</td>
    </ng-container>

    <ng-container matColumnDef="created">
      <th mat-header-cell *matHeaderCellDef mat-sort-header class="header">Created</th>
      <td mat-cell *matCellDef="let row">{{ row.created }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSize]="15" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
